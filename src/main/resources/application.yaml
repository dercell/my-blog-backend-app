spring:
  application:
    name: my-blog-backend-app
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:sa}
